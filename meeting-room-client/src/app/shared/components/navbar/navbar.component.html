<mat-toolbar color="primary" class="navbar">
  <span class="logo" routerLink="/dashboard">Meeting Room</span>

  <div class="nav-links">
    <a mat-button routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a mat-button routerLink="/rooms" routerLinkActive="active">Rooms</a>
    <a mat-button routerLink="/my-bookings" routerLinkActive="active">My Bookings</a>

    <ng-container *ngIf="isAdmin">
      <a mat-button routerLink="/admin/dashboard" routerLinkActive="active">Admin Panel</a>
    </ng-container>
  </div>

  <span class="spacer"></span>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
    <mat-icon>account_circle</mat-icon>
    <span class="user-name">{{ userName }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
